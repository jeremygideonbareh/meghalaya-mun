    <script>
      // Motion switch, before the first paint: the visitor's choice wins,
      // otherwise follow what their system asks for.
      ;(function () {
        var saved = null
        try {
          saved = localStorage.getItem('mmun-motion')
        } catch (e) {}
        var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches
        document.documentElement.dataset.motion = saved || (reduce ? 'off' : 'on')
      })()
    </script>

    <!-- Title sequence: the crown draws itself, a counter runs to
         100, the three theme words flicker past, and the letterbox opens. -->
    <style>
      #intro {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: grid;
        place-items: center;
        background: #7d0000;
        color: #f5e5cc;
        pointer-events: none;
      }
      #intro .bar {
        position: fixed;
        left: 0;
        right: 0;
        height: 50vh;
        background: #7d0000;
        transition: transform 1.1s cubic-bezier(0.76, 0, 0.24, 1);
      }
      #intro .bar.top {
        top: 0;
      }
      #intro .bar.bottom {
        bottom: 0;
      }
      #intro .stage {
        position: relative;
        z-index: 2;
        display: grid;
        justify-items: center;
        gap: 22px;
        transition:
          opacity 0.5s ease,
          transform 0.9s cubic-bezier(0.76, 0, 0.24, 1);
      }
      #intro svg {
        width: 132px;
        height: auto;
        overflow: visible;
      }
      #intro .crown {
        fill: #f5e5cc;
        clip-path: inset(100% 0 0 0);
        animation: intro-rise 1.3s cubic-bezier(0.65, 0, 0.35, 1) 0.15s forwards;
      }
      #intro .count,
      #intro .words {
        opacity: 0;
        transition: opacity 0.35s ease;
      }
      html.intro-type #intro .count,
      html.intro-type #intro .words {
        opacity: 1;
      }
      #intro .count {
        font:
          500 clamp(64px, 12vw, 132px) / 1 'Ranade',
          system-ui,
          sans-serif;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.02em;
      }
      #intro .words {
        display: flex;
        gap: 18px;
        font:
          500 12px/1 'Geist Mono Variable',
          ui-monospace,
          monospace;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #f5e5cc;
      }
      #intro .words span {
        opacity: 0;
        animation: intro-word 0.5s ease forwards;
      }
      #intro .words span:nth-child(1) {
        animation-delay: 0.5s;
      }
      #intro .words span:nth-child(2) {
        animation-delay: 0.9s;
      }
      #intro .words span:nth-child(3) {
        animation-delay: 1.3s;
      }
      @keyframes intro-rise {
        to {
          clip-path: inset(0 0 0 0);
        }
      }
      @keyframes intro-word {
        from {
          opacity: 0;
          transform: translateY(8px);
          filter: blur(6px);
        }
        to {
          opacity: 1;
          transform: none;
          filter: none;
        }
      }
      html.intro-out #intro {
        background: transparent;
      }
      html.intro-out #intro .stage {
        opacity: 0;
        transform: scale(1.08);
      }
      html.intro-out #intro .bar.top {
        transform: translateY(-100%);
      }
      html.intro-out #intro .bar.bottom {
        transform: translateY(100%);
      }
      html.intro-gone #intro {
        display: none;
      }
      html[data-motion='off'] #intro {
        display: none;
      }
    </style>

    <script>
      // Count to 100, then open the letterbox once the app is ready too.
      // A hard timeout means the intro can never trap anyone.
      ;(function () {
        var html = document.documentElement
        if (html.dataset.motion === 'off') return
        var el = document.getElementById('intro-count')
        var start = 0
        var dur = 1600
        var counted = false
        function tick(now) {
          if (!start) start = now
          var t = Math.min(1, (now - start) / dur)
          var eased = 1 - Math.pow(1 - t, 3)
          el.textContent = String(Math.round(eased * 100)).padStart(2, '0')
          if (t < 1) requestAnimationFrame(tick)
          else {
            counted = true
            maybeOpen()
          }
        }
        // start counting once the display face is in, so the digits never swap fonts
        var begun = false
        function begin() {
          if (begun) return
          begun = true
          html.classList.add('intro-type')
          requestAnimationFrame(tick)
        }
        if (document.fonts && document.fonts.load) document.fonts.load('500 64px Ranade').then(begin, begin)
        else begin()
        setTimeout(begin, 900)
        var opened = false
        function open() {
          if (opened) return
          opened = true
          html.classList.add('intro-out')
          window.dispatchEvent(new Event('intro:out'))
          setTimeout(function () {
            html.classList.add('intro-gone')
          }, 1200)
        }
        function maybeOpen() {
          if (counted && html.classList.contains('app-ready')) open()
        }
        window.addEventListener('app:ready', maybeOpen)
        setTimeout(open, 4200)
      })()
    </script>
