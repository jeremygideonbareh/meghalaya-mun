<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Meghalaya Model United Nations · MMUN 2026, 7th International Shillong Edition</title>
    <meta
      name="description"
      content="Meghalaya Model United Nations (MMUN): youth diplomacy from Shillong. The 7th International Conference, Renovar · Renasci · Renascentia, 4–6 September 2026 at Shillong College."
    />
    <meta name="theme-color" content="#2e77d0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preload" href="/fonts/ranade-variable.woff2" as="font" type="font/woff2" crossorigin />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Meghalaya Model United Nations" />
    <meta property="og:description" content="Renovar · Renasci · Renascentia. The 7th International Shillong Edition." />
    <meta property="og:image" content="/og.jpg" />

    <script>
      // Motion switch, before the first paint: the visitor's choice wins,
      // otherwise follow what their system asks for.
      ;(function () {
        var saved = null
        try {
          saved = localStorage.getItem('mmun-motion')
        } catch (e) {}
        var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches
        document.documentElement.dataset.motion = saved || (reduce ? 'off' : 'on')
      })()
    </script>

    <!-- Title sequence: the crown draws itself, a counter runs to
         100, the three theme words flicker past, and the letterbox opens. -->
    <style>
      #intro {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: grid;
        place-items: center;
        background: #2e77d0;
        color: #fffcf5;
        pointer-events: none;
      }
      #intro .bar {
        position: fixed;
        left: 0;
        right: 0;
        height: 50vh;
        background: #2e77d0;
        transition: transform 1.1s cubic-bezier(0.76, 0, 0.24, 1);
      }
      #intro .bar.top {
        top: 0;
      }
      #intro .bar.bottom {
        bottom: 0;
      }
      #intro .stage {
        position: relative;
        z-index: 2;
        display: grid;
        justify-items: center;
        gap: 22px;
        transition:
          opacity 0.5s ease,
          transform 0.9s cubic-bezier(0.76, 0, 0.24, 1);
      }
      #intro svg {
        width: 132px;
        height: auto;
        overflow: visible;
      }
      #intro .draw {
        fill: none;
        stroke: #fffcf5;
        stroke-width: 2.2;
        stroke-linejoin: round;
        stroke-linecap: round;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation: intro-draw 1.5s cubic-bezier(0.65, 0, 0.35, 1) 0.15s forwards;
      }
      #intro .gem {
        fill: #f26b1d;
        opacity: 0;
        animation: intro-gem 0.4s ease 1.3s forwards;
      }
      #intro .count,
      #intro .words {
        opacity: 0;
        transition: opacity 0.35s ease;
      }
      html.intro-type #intro .count,
      html.intro-type #intro .words {
        opacity: 1;
      }
      #intro .count {
        font:
          500 clamp(64px, 12vw, 132px) / 1 'Ranade',
          system-ui,
          sans-serif;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.02em;
      }
      #intro .words {
        display: flex;
        gap: 18px;
        font:
          500 12px/1 'Geist Mono Variable',
          ui-monospace,
          monospace;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #fffcf5;
      }
      #intro .words span {
        opacity: 0;
        animation: intro-word 0.5s ease forwards;
      }
      #intro .words span:nth-child(1) {
        animation-delay: 0.5s;
      }
      #intro .words span:nth-child(2) {
        animation-delay: 0.9s;
      }
      #intro .words span:nth-child(3) {
        animation-delay: 1.3s;
      }
      @keyframes intro-draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes intro-gem {
        to {
          opacity: 1;
        }
      }
      @keyframes intro-word {
        from {
          opacity: 0;
          transform: translateY(8px);
          filter: blur(6px);
        }
        to {
          opacity: 1;
          transform: none;
          filter: none;
        }
      }
      html.intro-out #intro {
        background: transparent;
      }
      html.intro-out #intro .stage {
        opacity: 0;
        transform: scale(1.08);
      }
      html.intro-out #intro .bar.top {
        transform: translateY(-100%);
      }
      html.intro-out #intro .bar.bottom {
        transform: translateY(100%);
      }
      html.intro-gone #intro {
        display: none;
      }
      html[data-motion='off'] #intro {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="intro" role="status" aria-label="Loading Meghalaya Model United Nations">
      <div class="bar top"></div>
      <div class="bar bottom"></div>
      <div class="stage">
        <svg viewBox="0 0 120 90" aria-hidden="true">
          <path class="draw" pathLength="1" d="M14 64 8 26l22 18 10-30 12 26 8-34 8 34 12-26 10 30 22-18-6 38Z" />
          <path class="draw" pathLength="1" d="M16 72h88M19 80h82" />
          <circle class="gem" cx="8" cy="26" r="3.2" />
          <circle class="gem" cx="40" cy="14" r="3.2" />
          <circle class="gem" cx="60" cy="6" r="3.6" />
          <circle class="gem" cx="80" cy="14" r="3.2" />
          <circle class="gem" cx="112" cy="26" r="3.2" />
        </svg>
        <div class="count" id="intro-count">00</div>
        <div class="words"><span>Renovar</span><span>Renasci</span><span>Renascentia</span></div>
      </div>
    </div>

    <div id="root"></div>

    <script>
      // Count to 100, then open the letterbox once the app is ready too.
      // A hard timeout means the intro can never trap anyone.
      ;(function () {
        var html = document.documentElement
        if (html.dataset.motion === 'off') return
        var el = document.getElementById('intro-count')
        var start = 0
        var dur = 1600
        var counted = false
        function tick(now) {
          if (!start) start = now
          var t = Math.min(1, (now - start) / dur)
          var eased = 1 - Math.pow(1 - t, 3)
          el.textContent = String(Math.round(eased * 100)).padStart(2, '0')
          if (t < 1) requestAnimationFrame(tick)
          else {
            counted = true
            maybeOpen()
          }
        }
        // start counting once the display face is in, so the digits never swap fonts
        var begun = false
        function begin() {
          if (begun) return
          begun = true
          html.classList.add('intro-type')
          requestAnimationFrame(tick)
        }
        if (document.fonts && document.fonts.load) document.fonts.load('500 64px Ranade').then(begin, begin)
        else begin()
        setTimeout(begin, 900)
        var opened = false
        function open() {
          if (opened) return
          opened = true
          html.classList.add('intro-out')
          window.dispatchEvent(new Event('intro:out'))
          setTimeout(function () {
            html.classList.add('intro-gone')
          }, 1200)
        }
        function maybeOpen() {
          if (counted && html.classList.contains('app-ready')) open()
        }
        window.addEventListener('app:ready', maybeOpen)
        setTimeout(open, 4200)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
